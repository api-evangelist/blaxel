openapi: 3.2.0
info:
  title: Blaxel Control Plane Secrets API
  version: 0.0.1
servers:
- description: Blaxel Control Plane
  url: https://api.blaxel.ai/v0
- description: Blaxel Inference
  url: https://run.blaxel.ai
security:
- OAuth2:
  - admin
- ApiKeyAuth: []
tags:
- name: Secrets
paths:
  /secrets:
    delete:
      description: Deletes a secret by name (query parameter) from the workspace.
      operationId: DeleteSecretByQuery
      parameters:
      - description: Name of the secret
        in: query
        name: name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
          description: successful operation
      security:
      - OAuth2:
        - secrets:delete
      - ApiKeyAuth: []
      summary: Delete secret by query
      tags:
      - Secrets
      x-stainless-ignore: true
    get:
      description: Lists the secrets of the workspace. Values are write-only and never returned.
      operationId: ListSecrets
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Secret'
                type: array
          description: successful operation
      security:
      - OAuth2:
        - secrets:list
      - ApiKeyAuth: []
      summary: List secrets
      tags:
      - Secrets
    post:
      description: Creates or updates a secret by name. Each call stores a new immutable version; the latest version is the one resolved by the proxy.
      operationId: UpsertSecret
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Secret'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
          description: successful operation
      security:
      - OAuth2:
        - secrets:create
      - ApiKeyAuth: []
      summary: Upsert secret
      tags:
      - Secrets
  /secrets/{secretName}:
    delete:
      description: Deletes a secret and all its versions from the workspace.
      operationId: DeleteSecret
      parameters:
      - description: Name of the secret
        in: path
        name: secretName
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
          description: successful operation
      security:
      - OAuth2:
        - secrets:delete
      - ApiKeyAuth: []
      summary: Delete secret
      tags:
      - Secrets
components:
  schemas:
    Secret:
      type: object
      description: Workspace secret, referenced from proxy routing as {{SECRET:name}}. Values are write-only and can never be read back. Every upsert stores a new immutable version and the latest one is resolved at runtime.
      properties:
        createdAt:
          type: string
          description: The date and time when the secret was first created
          readOnly: true
        name:
          type: string
          description: Case-sensitive secret name
        updatedAt:
          type: string
          description: The date and time of the latest version
          readOnly: true
        value:
          type: string
          description: Secret value. Write-only, never returned by the API
      required:
      - name
  securitySchemes:
    ApiKeyAuth:
      bearerFormat: API Key
      description: Long-lived API key for programmatic access
      scheme: bearer
      type: http
