openapi: 3.2.0
info:
  title: Blaxel Control Plane Configurations API
  version: 0.0.1
servers:
- description: Blaxel Control Plane
  url: https://api.blaxel.ai/v0
- description: Blaxel Inference
  url: https://run.blaxel.ai
security:
- OAuth2:
  - admin
- ApiKeyAuth: []
tags:
- name: Configurations
paths:
  /configuration:
    get:
      description: Returns global platform configuration including available regions, countries, continents, and private locations for deployment policies.
      operationId: GetConfiguration
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
          description: Configuration of the control plane
      security:
      - OAuth2:
        - configurations:list
      - ApiKeyAuth: []
      summary: Get platform configuration
      tags:
      - Configurations
      x-stainless-ignore: true
components:
  schemas:
    Continent:
      type: object
      description: Continent
      properties:
        displayName:
          type: string
          description: Continent display name
        name:
          type: string
          description: Continent code
      x-stainless-ignore: true
    Region:
      type: object
      description: Region
      properties:
        agentDrivePublicUrl:
          type: object
          description: S3-compatible endpoint URL for drive storage in this region. Use {s3Endpoint}/{bucketName} to access drive contents.
        allowed:
          type: string
          description: Region display name
        continent:
          type: string
          description: Region display name
        country:
          type: string
          description: Region display name
        drivesAvailable:
          type: boolean
          description: Drives availability status - indicates if an S3 endpoint is configured for the region
        egressAvailable:
          type: boolean
          description: Egress availability status - indicates if network plane URL is configured for the region
        infoGeneration:
          type: string
          description: Region display name
        location:
          type: string
          description: Region display name
        mk31Available:
          type: boolean
          description: Whether this region supports mk3.1 (blaxel nodes). Required for Application and Job deployments.
        name:
          type: string
          description: Region name
        proxyAvailable:
          type: boolean
          description: Proxy availability status - indicates if the proxy plane is configured for the region
      x-stainless-ignore: true
    Country:
      type: object
      description: Configuration
      properties:
        displayName:
          type: string
          description: Country display name
        name:
          type: string
          description: Country code
      x-stainless-ignore: true
    Configuration:
      type: object
      description: Configuration
      properties:
        continents:
          type: array
          description: Continents
          items:
            $ref: '#/components/schemas/Continent'
        countries:
          type: array
          description: Countries
          items:
            $ref: '#/components/schemas/Country'
        detectedRegion:
          type: string
          description: Auto-detected closest region based on viewer geolocation (from CloudFront headers). Empty when geo headers are not available.
        privateLocations:
          type: array
          description: Private locations managed with blaxel operator
          items:
            $ref: '#/components/schemas/PrivateLocation'
        regions:
          type: array
          description: Regions
          items:
            $ref: '#/components/schemas/Region'
      x-stainless-ignore: true
    PrivateLocation:
      type: object
      description: Private location available for policies
      properties:
        name:
          type: string
          description: Location name
      x-stainless-ignore: true
