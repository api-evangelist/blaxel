openapi: 3.2.0
info:
  title: Blaxel Control Plane Service Accounts API
  version: 0.0.1
servers:
- description: Blaxel Control Plane
  url: https://api.blaxel.ai/v0
- description: Blaxel Inference
  url: https://run.blaxel.ai
security:
- OAuth2:
  - admin
- ApiKeyAuth: []
tags:
- name: service_accounts
paths:
  /service_accounts:
    get:
      description: Returns all service accounts in the workspace. Service accounts are machine identities for external systems to authenticate with Blaxel via OAuth or API keys.
      operationId: GetWorkspaceServiceAccounts
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    client_id:
                      description: Service account client ID
                      type: string
                    created_at:
                      description: Creation timestamp
                      type: string
                    description:
                      description: Service account description
                      type: string
                    name:
                      description: Service account name
                      type: string
                    role:
                      description: Role of the service account in the workspace
                      type: string
                    updated_at:
                      description: Last update timestamp
                      type: string
                  type: object
                type: array
          description: successful operation
      security:
      - OAuth2:
        - workspaces:get
      - ApiKeyAuth: []
      summary: List service accounts
      tags:
      - service_accounts
      x-stainless-ignore: true
    post:
      description: Creates a new service account for machine-to-machine authentication. Returns client ID and secret (secret is only shown once at creation). Use these credentials for OAuth client_credentials flow.
      operationId: CreateWorkspaceServiceAccount
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  description: Service account description
                  type: string
                name:
                  description: Service account name
                  type: string
                role:
                  description: Role of the service account in the workspace. Defaults to admin on creation; unchanged on update when omitted.
                  enum:
                  - viewer
                  - member
                  - admin
                  type: string
              required:
              - name
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  client_id:
                    description: Service account client ID
                    type: string
                  client_secret:
                    description: Service account client secret (only returned on creation)
                    type: string
                  created_at:
                    description: Creation timestamp
                    type: string
                  description:
                    description: Service account description
                    type: string
                  name:
                    description: Service account name
                    type: string
                  role:
                    description: Role of the service account in the workspace
                    type: string
                  updated_at:
                    description: Last update timestamp
                    type: string
                type: object
          description: successful operation
      security:
      - OAuth2:
        - workspaces:update
      - ApiKeyAuth: []
      summary: Create service account
      tags:
      - service_accounts
      x-stainless-ignore: true
  /service_accounts/{clientId}:
    delete:
      description: Permanently deletes a service account and invalidates all its credentials. Any systems using this service account will lose access immediately.
      operationId: DeleteWorkspaceServiceAccount
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  client_id:
                    description: Service account client ID
                    type: string
                  created_at:
                    description: Creation timestamp
                    type: string
                  description:
                    description: Service account description
                    type: string
                  name:
                    description: Service account name
                    type: string
                  updated_at:
                    description: Last update timestamp
                    type: string
                type: object
          description: successful operation
      security:
      - OAuth2:
        - workspaces:update
      - ApiKeyAuth: []
      summary: Delete service account
      tags:
      - service_accounts
      x-stainless-ignore: true
    put:
      description: Updates a service account's name or description. Credentials (client ID/secret) cannot be changed.
      operationId: UpdateWorkspaceServiceAccount
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  description: Service account description
                  type: string
                name:
                  description: Service account name
                  type: string
                role:
                  description: Role of the service account in the workspace. Defaults to admin on creation; unchanged on update when omitted.
                  enum:
                  - viewer
                  - member
                  - admin
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  client_id:
                    description: Service account client ID
                    type: string
                  created_at:
                    description: Creation timestamp
                    type: string
                  description:
                    description: Service account description
                    type: string
                  name:
                    description: Service account name
                    type: string
                  role:
                    description: Role of the service account in the workspace
                    type: string
                  updated_at:
                    description: Last update timestamp
                    type: string
                type: object
          description: successful operation
      security:
      - OAuth2:
        - workspaces:update
      - ApiKeyAuth: []
      summary: Update service account
      tags:
      - service_accounts
      x-stainless-ignore: true
  /service_accounts/{clientId}/api_keys:
    parameters:
    - description: Service account client ID
      in: path
      name: clientId
      required: true
      schema:
        type: string
    get:
      description: Returns all long-lived API keys created for a service account. API keys provide an alternative to OAuth for simpler authentication scenarios.
      operationId: ListApiKeysForServiceAccount
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiKey'
                type: array
          description: successful operation
      security:
      - OAuth2:
        - apiKey:list
      - ApiKeyAuth: []
      summary: List service account API keys
      tags:
      - service_accounts
      x-stainless-ignore: true
    post:
      description: Creates a new long-lived API key for a service account. The full key value is only returned once at creation. API keys can have optional expiration dates.
      operationId: CreateApiKeyForServiceAccount
      requestBody:
        content:
          application/json:
            schema:
              properties:
                expires_in:
                  description: Expiration period for the API key. Supports formats like '30d' (30 days), '24h' (24 hours), '1w' (1 week). If not set, the API key never expires.
                  type: string
                name:
                  description: Name for the API key
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
          description: successful operation
      security:
      - OAuth2:
        - apiKey:write
      - ApiKeyAuth: []
      summary: Create service account API key
      tags:
      - service_accounts
      x-stainless-ignore: true
  /service_accounts/{clientId}/api_keys/{apiKeyId}:
    parameters:
    - description: Service account client ID
      in: path
      name: clientId
      required: true
      schema:
        type: string
    - description: API key identifier to revoke
      in: path
      name: apiKeyId
      required: true
      schema:
        type: string
    delete:
      description: Revokes an API key for a service account. The key becomes invalid immediately and any requests using it will fail authentication.
      operationId: DeleteApiKeyForServiceAccount
      responses:
        '200':
          description: successful operation
      security:
      - OAuth2:
        - apiKey:write
      - ApiKeyAuth: []
      summary: Revoke service account API key
      tags:
      - service_accounts
      x-stainless-ignore: true
components:
  schemas:
    TimeFields:
      type: object
      description: Time fields for Persistence
      properties:
        createdAt:
          type: string
          description: The date and time when the resource was created
          readOnly: true
        updatedAt:
          type: string
          description: The date and time when the resource was updated
          readOnly: true
    OwnerFields:
      type: object
      description: Owner fields for Persistence
      properties:
        createdBy:
          type: string
          description: The user or service account who created the resource
          readOnly: true
        updatedBy:
          type: string
          description: The user or service account who updated the resource
          readOnly: true
    ApiKey:
      type: object
      description: Long-lived API key for accessing Blaxel
      allOf:
      - $ref: '#/components/schemas/TimeFields'
      - $ref: '#/components/schemas/OwnerFields'
      - properties:
          apiKey:
            type: string
            description: Api key
            readOnly: true
          expires_in:
            type: string
            description: Duration until expiration. Supports formats like '30d' (30 days), '24h' (24 hours), '1w' (1 week). Must be positive and at most 10 years. If not set, the API key never expires.
            example: 30d
          id:
            type: string
            description: Api key id, to retrieve it from the API
            readOnly: true
            example: ak_abc123def456
          name:
            type: string
            description: Name for the API key
            example: CI/CD Pipeline Key
          sub:
            type: string
            description: User subject identifier
            readOnly: true
          sub_type:
            type: string
            description: Subject type (user or service_account)
            example: user
  securitySchemes:
    ApiKeyAuth:
      bearerFormat: API Key
      description: Long-lived API key for programmatic access
      scheme: bearer
      type: http
    OAuth2:
      description: OAuth2 authentication with JWT tokens
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          scopes:
            admin: Administrative access
            agents:create: Create agents
            agents:delete: Delete agents
            agents:get: Get agent details
            agents:list: List agents
            agents:update: Update agents
            apiKey:list: List API keys
            apiKey:write: Create and delete API keys
            applications:create: Create applications
            applications:delete: Delete applications
            applications:get: Get application details
            applications:list: List applications
            applications:update: Update applications
            configurations:list: List configurations
            customdomains:create: Create custom domains
            customdomains:delete: Delete custom domains
            customdomains:get: Get custom domain details
            customdomains:list: List custom domains
            customdomains:update: Update custom domains
            functions:create: Create functions
