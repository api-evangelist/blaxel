openapi: 3.2.0
info:
  title: Blaxel Control Plane Feature Flags API
  version: 0.0.1
servers:
- description: Blaxel Control Plane
  url: https://api.blaxel.ai/v0
- description: Blaxel Inference
  url: https://run.blaxel.ai
security:
- OAuth2:
  - admin
- ApiKeyAuth: []
tags:
- name: featureFlags
paths:
  /features/{featureKey}:
    get:
      description: Evaluates a specific feature flag for the workspace with full details including variant and payload. Useful for testing and debugging feature flag targeting.
      operationId: testFeatureFlag
      parameters:
      - description: Name of the feature flag
        in: path
        name: featureKey
        required: true
        schema:
          type: string
      - description: Account ID to check feature flags for. When provided, evaluates the feature flag at the account level instead of the workspace level.
        in: query
        name: account
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                enabled: true
                evaluatedAt: '2026-02-09T10:30:00Z'
                featureKey: gpu_deployments
                payload:
                  allowed_types:
                  - A100
                  - H100
                  max_gpus: 4
                variant: variant_a
              schema:
                properties:
                  enabled:
                    type: boolean
                  evaluatedAt:
                    format: date-time
                    type: string
                  featureKey:
                    type: string
                  payload:
                    type: object
                  variant:
                    type: string
                type: object
          description: Feature flag evaluation result with details
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized - Invalid or missing authentication credentials
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden - You do not have access to this feature flag
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found - Feature flag not found
      security:
      - OAuth2:
        - featureFlags:get
      - ApiKeyAuth: []
      summary: Retrieve feature flag evaluation for workspace
      tags:
      - featureFlags
      x-stainless-ignore: true
components:
  schemas:
    Error:
      type: object
      description: Standard error response returned by the API when a request fails
      properties:
        code:
          type: integer
          description: HTTP status code of the error
          example: 409
        error:
          type: string
          description: Error type or code identifying the kind of error
          example: Resource already exists
        message:
          type: string
          description: Human-readable error message describing what went wrong
          example: Invalid request body
      required:
      - error
