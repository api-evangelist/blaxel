openapi: 3.2.0
info:
  title: Blaxel Control Plane Mcphub API
  version: 0.0.1
servers:
- description: Blaxel Control Plane
  url: https://api.blaxel.ai/v0
- description: Blaxel Inference
  url: https://run.blaxel.ai
security:
- OAuth2:
  - admin
- ApiKeyAuth: []
tags:
- name: mcphub
paths:
  /mcp/hub:
    get:
      description: Returns all pre-built MCP server definitions available in the Blaxel Hub. These can be deployed directly to your workspace with pre-configured tools and integrations.
      operationId: ListMCPHubDefinitions
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MCPDefinition'
                type: array
          description: successful operation
      security:
      - OAuth2:
        - mcphub:list
      - ApiKeyAuth: []
      summary: List MCP Hub servers
      tags:
      - mcphub
      x-stainless-ignore: true
components:
  schemas:
    MCPDefinition:
      type: object
      description: Definition of an MCP from the MCP Hub
      allOf:
      - $ref: '#/components/schemas/TimeFields'
      - properties:
          categories:
            type: array
            description: Categories of the artifact
            items:
              type: object
              additionalProperties: true
          coming_soon:
            type: boolean
            description: If the artifact is coming soon
          description:
            type: string
            description: Description of the artifact
          displayName:
            type: string
            description: Display name of the artifact
          enterprise:
            type: boolean
            description: If the artifact is enterprise
          entrypoint:
            $ref: '#/components/schemas/Entrypoint'
          form:
            $ref: '#/components/schemas/Form'
          hidden:
            type: boolean
            description: If the artifact is hidden
          hiddenSecrets:
            type: array
            description: Hidden secrets of the artifact
            items:
              type: string
          icon:
            type: string
            description: Icon of the artifact
          image:
            type: string
            description: Image of the artifact
          integration:
            type: string
            description: Integration of the artifact
          longDescription:
            type: string
            description: Long description of the artifact
          name:
            type: string
            description: Name of the artifact
          transport:
            type: string
            description: Transport compatibility for the MCP, can be "websocket" or "http-stream"
          url:
            type: string
            description: URL of the artifact
    OAuth:
      type: object
      description: OAuth of the artifact
      properties:
        scope:
          type: array
          description: Scope of the OAuth
          items:
            type: object
            additionalProperties: true
        type:
          type: string
          description: Type of the OAuth
    Form:
      type: object
      description: Form of the artifact
      properties:
        config:
          type: object
          description: Config of the artifact
          additionalProperties: true
        oauth:
          $ref: '#/components/schemas/OAuth'
        secrets:
          type: object
          description: Secrets of the artifact
          additionalProperties: true
    TimeFields:
      type: object
      description: Time fields for Persistence
      properties:
        createdAt:
          type: string
          description: The date and time when the resource was created
          readOnly: true
        updatedAt:
          type: string
          description: The date and time when the resource was updated
          readOnly: true
    Entrypoint:
      type: object
      description: Entrypoint of the artifact
      properties:
        args:
          type: array
          description: Args of the entrypoint
          items:
            type: object
            additionalProperties: true
        command:
          type: string
          description: Command of the entrypoint
        env:
          type: object
          description: Env of the entrypoint
          additionalProperties:
            type: string
        superGatewayArgs:
          type: array
          description: Super Gateway args of the entrypoint
          items:
            type: object
            additionalProperties: true
  securitySchemes:
    ApiKeyAuth:
      bearerFormat: API Key
      description: Long-lived API key for programmatic access
      scheme: bearer
      type: http
    OAuth2:
      description: OAuth2 authentication with JWT tokens
      flows:
        authorizationCode:
