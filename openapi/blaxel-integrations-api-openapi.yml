openapi: 3.2.0
info:
  title: Blaxel Control Plane Integrations API
  version: 0.0.1
servers:
- description: Blaxel Control Plane
  url: https://api.blaxel.ai/v0
- description: Blaxel Inference
  url: https://run.blaxel.ai
security:
- OAuth2:
  - admin
- ApiKeyAuth: []
tags:
- name: Integrations
paths:
  /integrations/{integrationName}:
    get:
      description: Returns metadata about an integration provider including available endpoints, authentication methods, and supported models or features.
      operationId: GetIntegration
      parameters:
      - description: Name of the integration
        in: path
        name: integrationName
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
          description: successful operation
      security:
      - OAuth2:
        - integrations:list
      - ApiKeyAuth: []
      summary: Get integration provider info
      tags:
      - Integrations
  /integrations/connections:
    get:
      description: Returns all configured integration connections in the workspace. Each connection stores credentials and settings for an external service (LLM provider, API, database).
      operationId: ListIntegrationConnections
      parameters:
      - $ref: '#/components/parameters/ExternalIdFilter'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IntegrationConnection'
                type: array
          description: successful operation
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized - Invalid or missing authentication credentials
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden - Insufficient permissions to list integration connections
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - OAuth2:
        - integrations:list
      - ApiKeyAuth: []
      summary: List integration connections
      tags:
      - Integrations
    post:
      description: Creates a new integration connection with credentials for an external service. The connection can then be used by models, functions, and other resources to authenticate with the service.
      operationId: CreateIntegrationConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationConnection'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnection'
          description: successful operation
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request - Invalid integration configuration or unsupported integration type
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized - Invalid or missing authentication credentials
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden - Insufficient permissions to create integration connections
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict - Integration connection with this name already exists
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - OAuth2:
        - integrations:create
      - ApiKeyAuth: []
      summary: Create integration connection
      tags:
      - Integrations
  /integrations/connections/{connectionName}:
    parameters:
    - description: Unique name identifier of the integration connection
      in: path
      name: connectionName
      required: true
      schema:
        type: string
    delete:
      description: Permanently deletes an integration connection. Any resources using this connection will lose access to the external service.
      operationId: DeleteIntegrationConnection
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnection'
          description: successful operation
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized - Invalid or missing authentication credentials
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden - Insufficient permissions to delete this connection
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found - Integration connection does not exist
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict - Integration connection is in use by models or functions
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - OAuth2:
        - integrations:delete
      - ApiKeyAuth: []
      summary: Delete integration connection
      tags:
      - Integrations
    get:
      description: Returns detailed information about an integration connection including its provider type, configuration (secrets are masked), and usage status.
      operationId: GetIntegrationConnection
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnection'
          description: successful operation
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized - Invalid or missing authentication credentials
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden - Insufficient permissions to view this connection
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found - Integration connection does not exist
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - OAuth2:
        - integrations:get
      - ApiKeyAuth: []
      summary: Get integration connection
      tags:
      - Integrations
    put:
      description: Updates an integration connection's configuration or credentials. Changes take effect immediately for all resources using this connection.
      operationId: UpdateIntegrationConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationConnection'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnection'
          description: successful operation
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request - Invalid integration configuration
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized - Invalid or missing authentication credentials
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden - Insufficient permissions to update this connection
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found - Integration connection does not exist
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - OAuth2:
        - integrations:update
      - ApiKeyAuth: []
      summary: Update integration connection
      tags:
      - Integrations
  /integrations/connections/{connectionName}/endpointConfigurations:
    get:
      description: Returns a list of all endpoint configurations for a model.
      operationId: GetIntegrationConnectionModelEndpointConfigurations
      parameters:
      - description: Name of the connection
        in: path
        name: connectionName
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
      security:
      - OAuth2:
        - integrations:list
      - ApiKeyAuth: []
      summary: Get integration connection model endpoint configurations
      tags:
      - Integrations
      x-stainless-ignore: true
  /integrations/connections/{connectionName}/models:
    get:
      description: Returns a list of all models for an integration connection.
      operationId: ListIntegrationConnectionModels
      parameters:
      - description: Name of the connection
        in: path
        name: connectionName
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
      security:
      - OAuth2:
        - integrations:list
      - ApiKeyAuth: []
      summary: List integration connection models
      tags:
      - Integrations
      x-stainless-ignore: true
  /integrations/connections/{connectionName}/models/{modelId}:
    get:
      description: Returns a model for an integration connection by ID.
      operationId: GetIntegrationConnectionModel
      parameters:
      - description: Name of the connection
        in: path
        name: connectionName
        required: true
        schema:
          type: string
      - description: Model ID
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
      security:
      - OAuth2:
        - integrations:get
      - ApiKeyAuth: []
      summary: Get integration connection model
      tags:
      - Integrations
      x-stainless-ignore: true
components:
  schemas:
    IntegrationHeaders:
      type: object
      description: Integration headers
      additionalProperties:
        type: string
    IntegrationEndpoint:
      type: object
      description: Integration endpoint
      properties:
        body:
          type: string
          description: Integration endpoint body
        ignoreModels:
          type: array
          description: Integration endpoint ignore models
          items:
            type: object
            additionalProperties: true
        method:
          type: string
          description: Integration endpoint method
        models:
          type: array
          description: Integration endpoint models
          items:
            type: object
            additionalProperties: true
        streamKey:
          type: string
          description: Integration endpoint stream key
        streamToken:
          $ref: '#/components/schemas/IntegrationEndpointToken'
        token:
          $ref: '#/components/schemas/IntegrationEndpointToken'
    Metadata:
      type: object
      description: Common metadata fields shared by all Blaxel resources including name, labels, timestamps, and ownership information
      allOf:
      - $ref: '#/components/schemas/TimeFields'
      - $ref: '#/components/schemas/OwnerFields'
      - properties:
          displayName:
            type: string
            description: Human-readable name for display in the UI. Can contain spaces and special characters, max 63 characters.
            example: My Resource
          externalId:
            type: string
            description: Caller-owned identifier for external lookups. Max 64 chars, alphanumeric + dash.
            example: my-session-123
          labels:
            $ref: '#/components/schemas/MetadataLabels'
          name:
            type: string
            description: Unique identifier for the resource within the workspace. Must be lowercase alphanumeric with hyphens, max 49 characters. Immutable after creation.
            example: my-resource
          plan:
            type: string
            description: Billing plan tier applied to this resource (inherited from workspace account)
            readOnly: true
          url:
            type: string
            description: Auto-generated endpoint URL for accessing this resource (for agents, functions, models, sandboxes)
            readOnly: true
          workspace:
            type: string
            description: Name of the workspace this resource belongs to (read-only, set automatically)
            readOnly: true
        required:
        - name
    IntegrationConnection:
      type: object
      description: Configured connection to an external service (LLM provider, API, SaaS, database) storing credentials and settings for use by workspace resources.
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/IntegrationConnectionSpec'
      required:
      - metadata
      - spec
    IntegrationEndpoints:
      type: object
      description: Integration endpoints
      additionalProperties:
        $ref: '#/components/schemas/IntegrationEndpoint'
    IntegrationOrganization:
      type: object
      description: Integration organization
      properties:
        avatar_url:
          type: string
          description: Provider organization avatar URL
        displayName:
          type: string
          description: Provider organization display name
        id:
          type: string
          description: Provider organization ID
        name:
          type: string
          description: Provider organization name
    Integration:
      type: object
      description: Integration
      properties:
        additionalInfos:
          type: object
          description: Integration additional infos
          additionalProperties:
            type: string
        endpoints:
          $ref: '#/components/schemas/IntegrationEndpoints'
        headers:
          $ref: '#/components/schemas/IntegrationHeaders'
        name:
          type: string
          description: Integration name
        organizations:
          type: array
          description: Integration organizations
          items:
            $ref: '#/components/schemas/IntegrationOrganization'
        params:
          $ref: '#/components/schemas/IntegrationQueryParams'
        repositories:
          type: array
          description: Integration repositories
          items:
            $ref: '#/components/schemas/IntegrationRepository'
    MetadataLabels:
      type: object
      description: Key-value pairs for organizing and filtering resources. Labels can be used to categorize resources by environment, project, team, or any custom taxonomy.
      additionalProperties:
        type: string
    IntegrationConnectionSpec:
      type: object
      description: Specification defining the integration type, configuration parameters, and encrypted credentials
      properties:
        config:
          type: object
          description: Non-sensitive configuration parameters for the integration (e.g., organization ID, region)
          additionalProperties:
            type: string
        integration:
          type: string
          description: Integration provider type (e.g., openai, anthropic, github, slack)
          example: openai
        sandbox:
          type: boolean
          description: Whether this connection uses sandbox/test credentials instead of production
          example: false
        secret:
          type: object
          description: Encrypted credentials and API keys for authenticating with the external service
          additionalProperties:
            type: string
    IntegrationRepository:
      type: object
      description: Integration repository
      properties:
        id:
          type: string
          description: Repository ID
        isBl:
          type: boolean
          description: Whether the repository has Blaxel imports
        name:
          type: string
          description: Repository name
        organization:
          type: string
          description: Repository owner
        url:
          type: string
          description: Repository URL
    IntegrationEndpointToken:
      type: object
      description: Integration endpoint token
      properties:
        received:
          type: string
          description: Integration endpoint token received
        sent:
          type: string
          description: Integration endpoint token sent
        total:
          type: string
          description: Integration endpoint token total
    IntegrationQueryParams:
      type: object
      description: Integration query params
      additionalProperties:
        type: string
    TimeFields:
      type: object
      description: Time fields for Persistence
      properties:
        createdAt:
          type: string
          description: The date and time when the resource was created
          readOnly: true
        updatedAt:
          type: string
          description: The date and time when the resource was updated
          readOnly: true
    OwnerFields:
      type: object
      description: Owner fields for Persistence
      properties:
        createdBy:
          type: string
          description: The user or service account who created the resource
          readOnly: true
        updatedBy:
          type: string
          description: The user or service account who updated the resource
          readOnly: true
    Error:
      type: object
      description: Standard error response returned by the API when a request fails
      properties:
        code:
          type: integer
          description: HTTP status code of the error
          example: 409
        error:
          type: string
          description: Error type or code identifying the kind of error
          example: Resource already exists
        message:
          type: string
          description: Human-readable error message describing what went wrong
          example: Invalid request body
      required:
      - error
  parameters:
    ExternalIdFilter:
      description: Filter resources by metadata.externalId. When set, only resources matching this caller-owned external ID are returned.
      in: query
      name: externalId
      required: false
      schema:
        maxLength: 64
        pattern: ^[a-zA-Z0-9-]*$
        type: string
  securitySchemes:
    ApiKeyAuth:
      bearerFormat: API Key
      description: Long-lived API key for programmatic access
      scheme: bearer
      type: http
    OAuth2:
      description: OAuth2 authentication with JWT tokens
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          scopes:
            admin: Administrative access
            agents:create: Create agents
            agents:delete: Delete agents
            agents:get: Get agent details
            agents:list: List agents
            agents:update: Update agents
            apiKey:list: List API keys
            apiKey:write: Create and delete API keys
